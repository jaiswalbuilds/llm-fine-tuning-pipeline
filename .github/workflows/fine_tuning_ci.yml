name: LLM Fine-Tuning MLOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic pyyaml rouge-score

      - name: Run Pipeline Test Suite
        run: |
          pytest tests/

      - name: Test Dataset Preparation Script
        run: |
          python src/dataset_prep.py --input data/raw_sample.json --output_dir data/ --max_length 2048

      - name: Test Evaluation Benchmark Script
        run: |
          python src/eval_bench.py --eval_data data/val.jsonl --output eval_report.json
